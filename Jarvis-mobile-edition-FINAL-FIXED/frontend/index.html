<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>J.A.R.V.I.S</title><link rel="stylesheet" href="style.css"></head><body><header><h1>J.A.R.V.I.S</h1><p>PERSONAL AI ASSISTANT</p></header><div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="center"></div></div><p class="core-text">SYSTEM READY</p><div class="status"><h2>SYSTEM DIAGNOSTICS</h2><div class="row"><span>AI ENGINE</span><b class="on">● OPERATIONAL</b></div><div class="row"><span>CONNECTION</span><b class="on">● ONLINE</b></div><div class="row"><span>VOICE INTERFACE</span><b class="on">● READY</b></div><div class="row"><span>LONG-TERM MEMORY</span><b class="on">● ACTIVE</b></div></div><div class="chat" id="chat"></div><div class="input-area"><input id="msg" type="text" placeholder="Enter a command for J.A.R.V.I.S..."><button id="send">EXECUTE</button><button id="mic-btn" aria-label="Activate voice input">🎙️</button><button id="cam-btn" aria-label="Analyze image">📷</button><button id="clear-btn">CLEAR MEMORY</button><input id="img-input" type="file" accept="image/*" capture="environment" style="display:none"></div>

<script defer src="script.js"></script></body></html>
